services:
  jobpilot-mark2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobpilot-mark2
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent SQLite database storage, logs & preview across container restarts
      - ./data:/app/data
    environment:
      - TZ=Asia/Kolkata
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
